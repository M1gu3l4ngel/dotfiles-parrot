# ~/.config/gtk-4.0/settings.ini
# Ajustes de las apps GTK4 (Nautilus). Los colores están en gtk.css.
# El modo oscuro no se fija aquí: libadwaita lo toma de la preferencia del
# sistema (gsettings org.gnome.desktop.interface color-scheme 'prefer-dark').
# Se aplica al volver a abrir la app.

[Settings]
# Mismos iconos y cursor que el resto del sistema.
gtk-icon-theme-name=Flat-Remix-Green-Dark
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24
# Sin animaciones: cada transición retrasa la respuesta a un click, y con la
# GPU virtual de VMware se nota. Misma decisión que los fades de picom.
gtk-enable-animations=false
# Solo el botón de cerrar, a la derecha como en Windows. Maximizar y minimizar
# no aplican en bspwm (las ventanas son tiling y no hay barra de tareas).
gtk-decoration-layout=:close
