# Settings of the GTK4 apps (Nautilus); the colors are in gtk.css. Dark mode is not set here:
# libadwaita takes it from the system preference (gsettings org.gnome.desktop.interface
# color-scheme 'prefer-dark'). It applies when the app opens again.

[Settings]
# The same icons and cursor as the rest of the system.
gtk-icon-theme-name=Flat-Remix-Green-Dark
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24
# No animations: each transition delays the answer to a click, and VMware's virtual GPU shows it.
# The same decision as picom's fades.
gtk-enable-animations=false
# Only the close button, on the right as in Windows. Maximize and minimize do not apply in bspwm
# (windows tile and there is no taskbar).
gtk-decoration-layout=:close
