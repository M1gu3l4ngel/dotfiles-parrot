;; The workspaces bar (bspwm's desktops), centered at the top: it highlights the active workspace and
;; tells the ones with windows from the empty ones. A file apart from current.ini because it shares
;; no module with the status bars. launch.sh starts it with:
;;   polybar primary -c ~/.config/polybar/workspace.ini
;; Reload: Super+Alt+R, or ~/.config/polybar/launch.sh.

;; No reserved space: the bar floats over the desktop.
[global/wm]
margin-bottom = 0
margin-top = 0

;; The same palette as current.ini.
include-file = ~/.config/polybar/colors.ini

[bar/primary]
width = 18%
height = 40
offset-x = 41%
;; The same top margin as the other bars (current.ini).
offset-y = 12
bottom = false
;; The workspaces stay centered when their width changes.
fixed-center = true

background = ${color.bg}
foreground = ${color.text}

;; The same radius as the other bars (current.ini).
radius = 8
border-size = 1
border-color = ${color.border}

padding = 1
module-margin = 0

;; override-redirect: bspwm does not manage the bar as a window (it cannot move or enter the
;; tiling). wm-restack keeps it above the windows, fullscreen ones included.
override-redirect = true
wm-restack = bspwm

;; launch.sh closes the bars over this socket with `polybar-msg cmd quit` instead of killing them.
enable-ipc = true

;; The same family and size as the other bars' text (current.ini): the dots ● and • are told apart
;; at 12 pt.
font-0 = "CaskaydiaCove Nerd Font:size=12;3"

modules-center = workspaces

;; internal/xworkspaces works with bspwm because it exposes the workspaces through _NET_DESKTOP_*.
;; Each label is one state: active (focused), occupied (has windows), urgent (an app asks for
;; attention) and empty.
[module/workspaces]
type = internal/xworkspaces

;; Only this monitor's workspaces, switched with a click or the scroll wheel.
pin-workspaces = true
enable-click = true
enable-scroll = true

;; One dot for every workspace. For an icon per workspace, `icon-N = <name>;<icon>`, where <name>
;; matches `bspc monitor -d` in bspwmrc (I, II, III...), not its number.
icon-default = •

format = <label-state>

;; A hierarchy by color and size, from most to least important: active (big orange dot) > urgent
;; (red) > with windows (text) > empty (faint). Padding on both sides centers each dot in its click
;; area.

;; The system's focus color.
label-active = ●
label-active-foreground = ${color.accent}
label-active-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${color.text}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-foreground = ${color.alert}
label-urgent-padding = 1

;; Empty ones are there to find your way, almost blended with the background.
label-empty = %icon%
label-empty-foreground = ${color.subtle}
label-empty-padding = 1
