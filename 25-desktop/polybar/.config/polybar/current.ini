;; The floating status bars over bspwm's desktop: logo, network, VPN, Firefox and anonymity, target
;; and power. The workspaces bar lives in workspace.ini. launch.sh starts one polybar per bar:
;;   log            Parrot logo (left corner)
;;   ethernet_bar   Ethernet IP
;;   vpn_bar        VPN state (HTB, THM)
;;   launchers      personal and pentest Firefox, and anonymity
;;   target_to_hack target IP after `settarget` in zsh
;;   primary        power button (right corner)
;; Reload: Super+Alt+R, or ~/.config/polybar/launch.sh.
;;
;; No Nerd Font icon is written here: editing tools drop private use glyphs (PUA). They live in
;; the scripts in ~/.config/scripts/ as `$'\x..'` escapes.

;; No reserved space: the bars float at fixed positions and take no whole screen edge.
[global/wm]
margin-bottom = 0
margin-top = 0

;; The palette behind ${color.bg}, ${color.text}... Switching theme means copying colors_dark.ini or
;; colors_light.ini over colors.ini.
include-file = ~/.config/polybar/colors.ini

;; bar/main is never started: every bar does `inherit = bar/main` and sets only what differs (width,
;; X position and module), so height, colors and fonts change in one place.
[bar/main]
;; 40 px high (42 with the frame) and 12 px of spacing everywhere (screen edges and between bars),
;; bspwm's window_gap: bars and windows sit on one grid.
bottom = false
height = 40
offset-y = 12
;; The module stays centered when its content changes width.
fixed-center = true

background = ${color.bg}
foreground = ${color.text}

;; 8 px corners, one step below the windows' 10: smaller pieces, smaller radius. picom leaves the
;; bars out of its own rounding so this value holds.
radius = 8
;; 1 px frame, the same as bspwm's window border: bars and windows read as one system.
border-size = 1
border-color = ${color.border}

padding = 1
module-margin = 0

;; Keeps the bars above bspwm's windows; a fullscreen window would cover them otherwise.
wm-restack = bspwm

;; launch.sh closes the bars over this socket with `polybar-msg cmd quit` instead of killing them.
enable-ipc = true

;; Fonts, used in texts as %{TN}...%{T-}. %{T} counts from 1: %{T1} is font-0 and %{T2} font-1.
;; font-0: module text and icons. The same family as kitty, dunst and rofi, so the desktop speaks
;;         one typeface. 12 pt is 16 px at 96 DPI, the standard interface size. SemiBold (the
;;         family has no Medium): the Regular stroke gets lost on the dark bar.
;; font-1: the Parrot logo (U+F329), which Hack draws cleaner than CaskaydiaCove at this size.
font-0 = "CaskaydiaCove Nerd Font:style=SemiBold:size=12;3"
font-1 = "Hack Nerd Font Mono:size=20;6"

;; Bars from left to right. Widths in pixels, fitted to the content: with percentages a bar with two
;; icons was as wide as one with an IP. Each offset-x is the previous bar's offset + its width + 12.
;; The right-hand bars anchor to the right edge with `100%:-N` (N is the distance from the right
;; edge to the start of the bar), so the layout holds at any resolution.

;; Square: 42 x 42 with the frame.
[bar/log]
inherit = bar/main
width = 42
offset-x = 12
padding = 0
modules-center = parrot

;; 230 px fits a 15-character IP (xxx.xxx.xxx.xxx) with its icon.
[bar/ethernet_bar]
inherit = bar/main
width = 230
offset-x = 66
modules-center = ethernet_status

[bar/vpn_bar]
inherit = bar/main
width = 230
offset-x = 308
modules-center = vpn_status

;; Privacy and pentest tools together: personal Firefox, pentest Firefox and anonymity (a ghost,
;; green when on and grey when off; the script sets the color).
;; N = 512 = 366 (target) + 12 + 134 (its own width). module-margin = 1 puts a space on each side
;; of each icon. 134 px = 2 of frame + padding (2 x 9.4) + 3 modules x (margin + icon + space +
;; margin, 4 x 9.4): an exact fit with CaskaydiaCove at 12 pt.
[bar/launchers]
inherit = bar/main
width = 134
offset-x = 100%:-512
module-margin = 1
modules-center = firefox_personal firefox_pentest anon_status

;; N = 366 = 54 (power) + 12 + 300 (its own width). 300 px fits the IP and the machine name.
[bar/target_to_hack]
inherit = bar/main
width = 300
offset-x = 100%:-366
modules-center = target_module

;; The power button alone at the far right, apart from the rest so it is not clicked by mistake.
;; Square like the logo: N = 54 = 12 of margin + 42.
[bar/primary]
inherit = bar/main
width = 42
offset-x = 100%:-54
padding = 0
modules-center = power

;; Every module is a script in ~/.config/scripts/ (25-desktop/scripts/ in the repo); `interval` is
;; how many seconds until polybar runs it again. Never `interval = 0`: polybar reads it as rerunning
;; the script in a loop with no pause, not as "once" (it reached ~30 % of CPU and made the whole
;; desktop lag). Static icons use 86400, once a day.

;; A click opens the file manager, like Super+E.
[module/parrot]
type = custom/script
exec = ~/.config/scripts/parrot_module.sh
interval = 86400
click-left = /usr/bin/nautilus --new-window &

;; Every second: cheap reads (ip, a state file), so a VPN or target change shows at once.
[module/ethernet_status]
type = custom/script
exec = ~/.config/scripts/ethernet_status.sh
interval = 1

[module/vpn_status]
type = custom/script
exec = ~/.config/scripts/vpn_status.sh
interval = 1

[module/target_module]
type = custom/script
exec = ~/.config/scripts/victim_to_hack.sh
interval = 1

;; Shows the state toggle_anonymity.sh writes; a click toggles it.
[module/anon_status]
type = custom/script
exec = ~/.config/scripts/anon_module.sh
interval = 1
click-left = ~/.config/scripts/toggle_anonymity.sh

;; Opens the session menu (power off, reboot, log out) instead of powering off, so a wrong click
;; does not close everything.
[module/power]
type = custom/script
exec = ~/.config/scripts/power_module.sh
interval = 86400
click-left = ~/.config/scripts/powermenu.sh &

;; Each click opens an isolated profile; --no-remote lets both be open at once, or Firefox would
;; open a tab in the running instance. Personal: the default-esr profile. Pentest: the pentest
;; profile with a hardened user.js (no target leaks to third parties, no preloading, no WebRTC,
;; everything cleared on close; 70-system/firefox/pentest.user.js).
[module/firefox_personal]
type = custom/script
exec = ~/.config/scripts/firefox_personal_module.sh
interval = 86400
click-left = /usr/bin/firefox -P default-esr --no-remote &

;; TZ=UTC is a fallback in case privacy.resistFingerprinting (which Parrot turns on, and which
;; already hides the time zone) goes off. The same command as in sxhkdrc.
[module/firefox_pentest]
type = custom/script
exec = ~/.config/scripts/firefox_pentest_module.sh
interval = 86400
click-left = TZ=UTC /usr/bin/firefox -P pentest --no-remote &
