# The picom compositor: shadows, transparency, blur, fades and rounded corners. bspwmrc starts it
# with run_once. picom (v8+) watches this file and reads it again on save: no restart needed.

# 10 px softens the corner without turning the window into a pill; big radii (20+) cut content in
# the corners and look dated. The desktop's scale: windows 10, bars, notifications and menu 8,
# progress bars 4 (smaller pieces, smaller radius). Native in picom since v9, no fork needed.
corner-radius = 10;

# Apps that draw their own corners: if picom also clipped them, its radius would win and the cut
# would fall on the border the app draws. Dunst: corner_radius in dunstrc. polybar: radius in
# current.ini and workspace.ini (without this, the 40 px bars ended up as pills). rofi:
# border-radius in its theme (monokai-soda.rasi).
rounded-corners-exclude = [
  "class_g = 'Dunst'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
];

# Shadows off everywhere; the values below are ready for `shadow = true`. Shadows are expensive on
# integrated GPUs and can flicker with vsync off.
shadow = false
shadow-radius = 15
shadow-opacity = .5
shadow-offset-x = -15
shadow-offset-y = -15

# Firefox with an ARGB background gets artifacts on its edges with a shadow.
shadow-exclude = [
  "class_g = 'firefox' && argb"
];

# Off on purpose: a fade delays every window appearing and disappearing, and a workspace switch
# feels like lag, not smoothness. If turned on, the steps are the opacity gained per frame: lower
# is slower (0.03 is picom's default).
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

# No transparency anywhere. For semi-transparent inactive windows, lower inactive-opacity to about
# 0.85.
inactive-opacity = 1.0
frame-opacity = 1.0
opacity = 1.0

# false respects the opacity each app asks for through _NET_WM_OPACITY instead of forcing
# inactive-opacity over it.
inactive-opacity-override = false;

active-opacity = 1.0

# Cairo-clock gets a translucent background when it loses the focus, and looks broken.
focus-exclude = [ "class_g = 'Cairo-clock'" ];

# Blur off: with blur-method "none" the values below do nothing. To blur semi-transparent windows,
# set the method to "dual_kawase" or "gaussian" and blur-background to true.
blur-method = "none"
blur-size = 2
blur-strength = 3
blur-background = false

# glx composes with OpenGL on the GPU. xrender composes on the CPU, and with rounded corners every
# workspace switch redraws the whole screen in software, which shows as lag; glx is also needed for
# dual_kawase blur. In VMware it needs "Accelerate 3D graphics" on in the VM. With the vmwgfx
# driver, `glxinfo -B` and `picom --diagnostics` say "Accelerated: no" even when the GPU is in use;
# what confirms acceleration is the "SVGA3D" renderer, not "llvmpipe".
backend = "glx";

# Off: in bspwm it can add latency when moving windows on some machines. Turn it on if you see
# horizontal tearing.
vsync = false

# bspwm uses override-redirect in some cases; without these, focused windows keep the inactive
# opacity.
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Notices when an app already draws rounded corners and does not add its own on top.
detect-rounded-corners = true;

# Reads _NET_WM_OPACITY from the client window, not only the frame, or per-app opacity fails in
# some window managers.
detect-client-opacity = true;

# Groups child windows (dialogs, popups) with their parent so they share the focus: without it, a
# menu dims its parent window.
detect-transient = true
detect-client-leader = true

# Redraws only the parts of the screen that changed, which saves a lot of CPU and GPU. Turn it off
# only if artifacts appear.
use-damage = true

log-level = "warn";

# Per window type: no shadows on menus and drag and drop, so they leave no marks when they close
# fast, and a denser, offset shadow for tooltips.
wintypes:
{
  tooltip       = { fade = true; shadow = true; shadow-radius = 0; shadow-opacity = 1.0; shadow-offset-x = -20; shadow-offset-y = -20; opacity = 0.8; full-shadow = true; };
  dnd           = { shadow = false; }
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
}
