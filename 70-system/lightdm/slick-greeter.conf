# Installed as /etc/lightdm/slick-greeter.conf. LightDM's login screen (slick-greeter), which is
# also the lock screen (Super+Shift+X runs dm-tool lock). 70-system/setup.sh installs it as a
# root:root copy over Parrot's (parrot-displaymanager package), keeping the original in
# /etc/lightdm/slick-greeter.conf.parrot. It applies at the next login or lock, with no restart.

[Greeter]
# The desktop's wallpaper, so locking and unlocking look continuous: a copy of the repo's wallpaper
# in a path the lightdm user can read (it has no access to home folders).
background=/usr/share/backgrounds/dotfiles-wallpaper.jpg
# Always the background above, not the one AccountsService keeps per user.
draw-user-background=false
# No dot grid drawn over the background.
draw-grid=false

# Parrot's values, unchanged: dark GTK theme, icons and logo.
logo=/usr/share/icons/parrot-logo.png
theme-name=ARK-Dark
icon-theme-name=Maia
