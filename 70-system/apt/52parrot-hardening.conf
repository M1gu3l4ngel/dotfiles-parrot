// Installed as /etc/apt/apt.conf.d/52parrot-hardening.conf. unattended-upgrades overrides for
// Parrot Security 7 (echo).
//
// apt reads /etc/apt/apt.conf.d/ in alphabetical order and keeps the last value read, hence 52-,
// after the default 50unattended-upgrades: it replaces Origins-Pattern and Package-Blacklist
// without touching the package's file, so later apt upgrades bring no conflict.
//
// Only security updates install on their own. Regular updates and backports wait for a manual
// `apt upgrade`, so no tool breaks in the middle of an engagement.

// Parrot's only origin is o=Parrot, with parrot-security as the archive for critical updates.
// Debian-Security is not used: Parrot does not pull from it (everything goes through its mirrors).
Unattended-Upgrade::Origins-Pattern {
    "o=Parrot,a=parrot-security";
};

// Python regexes of packages that never update on their own, because a behavior change in the
// middle of an engagement costs more than waiting:
// - anonsurf: flag or config changes can break the Super+A toggle.
// - nmap: flags and output format change between minor versions.
// - metasploit-framework: a massive update, better done by hand.
// - burpsuite: the same (the active testing proxy).
//
// Left out on purpose:
// - tor: its security patches protect the anonymity directly, and its config does not change
//   between parrot-security versions.
// - the kernel (linux-image-, linux-headers-): the most critical surface of the system. With
//   Automatic-Reboot "false" installing it interrupts nothing: the new kernel is used only after
//   the next manual reboot.
Unattended-Upgrade::Package-Blacklist {
    "anonsurf$";
    "nmap$";
    "metasploit-framework$";
    "burpsuite";
};

// Set explicitly even though they match the defaults, so they stay visible: never reboot the VM in
// the middle of an engagement, and keep old kernels to go back if a new one fails.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
