# GnuPG's agent: the process that keeps the key's passphrase in memory to sign commits and decrypt
# pass secrets. install.sh links only this file; ~/.gnupg stays a real folder with mode 700 (gpg
# refuses a home folder with open permissions). To reload after an edit:
# gpg-connect-agent reloadagent /bye

# pinentry-gnome3 asks for the passphrase in a graphical dialog (gcr's prompter, which works on
# bspwm through D-Bus): type it and press Enter, as on Windows. With no graphical session (over SSH)
# it asks in the terminal instead, which needs GPG_TTY (see .zshrc).
pinentry-program /usr/bin/pinentry-gnome3

# The same values as on Windows. The passphrase is asked again at whichever comes first:
#   default-cache-ttl  10 min without use. Each signature restarts the count, so a run of commits
#                      does not ask every time, and the key locks itself soon after you step away.
#   max-cache-ttl      2 h after it was entered, even while in use, so the key never stays
#                      unlocked indefinitely.
default-cache-ttl 600
max-cache-ttl 7200
