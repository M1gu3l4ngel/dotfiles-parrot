# On every push to main and every pull request, runs tools/check.sh: shell syntax, shellcheck and
# shfmt, zsh, Lua, JSON, sudoers, XKB, public repo hygiene, the bilingual docs, the task panel
# format, the install tests and gitleaks over the whole history. The same as ./tools/check.sh
# locally. node comes with the runner: there is no package.json to pin it in.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the code.
permissions:
  contents: read

# A new push cancels the previous run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag (v7) can be moved to other code; a SHA
      # cannot. Dependabot proposes the bumps once a month.
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: gitleaks scans every commit, not only the last one.
          fetch-depth: 0
          # Leaves no GitHub token in the runner's .git/config.
          persist-credentials: false

      # The docs and panel checkers and the Claude Code layer the install tests link come from
      # dotfiles-windows, pinned to a commit like the actions: a new version there cannot change
      # what passes here until this SHA moves.
      - name: Check out the Claude Code layer (dotfiles-windows)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: M1gu3l4ngel/dotfiles-windows
          ref: 5d88fe9f36f780bab3872a1f6b6b79fcc3b5f605
          path: .ci/dotfiles-windows
          persist-credentials: false

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt zsh lua5.1 x11-xkb-utils

      # gitleaks is not in apt: the official binary at a pinned version, checked against its
      # SHA-256 before it runs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run tools/check.sh
        env:
          CLAUDE_LAYER_DIR: ${{ github.workspace }}/.ci/dotfiles-windows/50-claude
        run: ./tools/check.sh
