# ~/.gnupg/gpg-agent.conf
# Configuración del agente de GnuPG: el proceso que guarda en memoria la
# passphrase de la clave para firmar commits y descifrar secretos de `pass`.
# install.sh enlaza solo este archivo; ~/.gnupg sigue siendo un directorio
# real con permisos 700 (gpg rechaza un homedir con permisos abiertos).
# Para recargar tras editar: gpg-connect-agent reloadagent /bye

# ----- PINENTRY -----
# Programa que pide la passphrase. pinentry-gnome3 abre un diálogo gráfico
# (el prompter de gcr, que funciona en bspwm vía D-Bus): escribir y Enter,
# igual que en Windows. Sin sesión gráfica (p. ej. por SSH) pasa solo a pedirla
# en la terminal, para lo que necesita GPG_TTY (ver .zshrc).
pinentry-program /usr/bin/pinentry-gnome3

# ----- CACHÉ DE LA PASSPHRASE -----
# Mismos valores que en Windows. La pide de nuevo con lo que ocurra primero:
# default-cache-ttl: 10 min sin usarla. Cada firma reinicia el contador, así
#   que una sesión de commits seguidos no la pide cada vez; si te alejas del
#   equipo, la clave se bloquea sola en poco tiempo.
# max-cache-ttl: 2 h desde que se introdujo, aunque se siga usando. Tope para
#   que la clave no quede desbloqueada indefinidamente.
default-cache-ttl 600
max-cache-ttl 7200
