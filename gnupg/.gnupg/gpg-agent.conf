# ~/.gnupg/gpg-agent.conf
# Configuración del agente de GnuPG: el proceso que guarda en memoria la
# passphrase de la clave para firmar commits y descifrar secretos de `pass`.
# install.sh enlaza solo este archivo; ~/.gnupg sigue siendo un directorio
# real con permisos 700 (gpg rechaza un homedir con permisos abiertos).
# Para recargar tras editar: gpg-connect-agent reloadagent /bye

# ----- PINENTRY -----
# Programa que pide la passphrase. pinentry-curses la pide dentro de la propia
# terminal. Se fija explícito porque el default del sistema (pinentry-gnome3)
# necesita el prompter de GNOME, que en bspwm no existe: sin esto, la firma de
# commits falla con "gpg failed to sign the data".
# Requiere GPG_TTY exportado en la shell (ver .zshrc).
pinentry-program /usr/bin/pinentry-curses

# ----- CACHÉ DE LA PASSPHRASE -----
# default-cache-ttl: segundos que se recuerda desde el ÚLTIMO uso (1 h), así
# una sesión de commits seguidos no la pide cada vez.
# max-cache-ttl: tope absoluto desde que se introdujo (8 h), aunque se siga
# usando; al terminar la jornada hay que volver a introducirla.
default-cache-ttl 3600
max-cache-ttl 28800
