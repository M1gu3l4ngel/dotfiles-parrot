;; ~/.config/polybar/workspace.ini
;; Barra de workspaces (escritorios de bspwm) centrada arriba. Resalta el
;; workspace activo y distingue los que tienen ventanas de los vacíos.
;; Va en un archivo aparte de current.ini porque no comparte módulos con las
;; barras de estado y se lanza con su propia config.
;;
;; launch.sh lanza esta barra con:
;;   polybar primary -c ~/.config/polybar/workspace.ini
;;
;; Recargar: Super+Alt+R o ~/.config/polybar/launch.sh

;; ----- AJUSTES GLOBALES DEL WM -----
;; Sin reserva de espacio: la barra flota sobre el escritorio.
[global/wm]
margin-bottom = 0
margin-top = 0

;; ----- INCLUDES -----
;; Paleta compartida (mismo colors.ini que current.ini).
include-file = ~/.config/polybar/colors.ini

;; =============================================================================
;; BARRA
;; =============================================================================
[bar/primary]
width = 18%
height = 40
offset-x = 41%
;; 12 px: mismo margen superior que las demás barras (current.ini).
offset-y = 12
bottom = false
;; El bloque de workspaces queda centrado aunque cambie su ancho.
fixed-center = true

background = ${color.bg}
foreground = ${color.text}

;; Esquinas redondeadas (px): mismo radio que las demás barras (current.ini).
radius = 8
border-size = 1
border-color = ${color.border}

padding = 1
module-margin = 0

;; override-redirect: bspwm no gestiona la barra como ventana (no se puede
;; mover ni entra en el tiling). wm-restack la mantiene por encima de las
;; ventanas, incluidas las de fullscreen.
override-redirect = true
wm-restack = bspwm

;; Misma familia y tamaño que el texto de las demás barras (current.ini): los
;; puntos ● y • ya se distinguen a 12 pt.
font-0 = "CaskaydiaCove Nerd Font:size=12;3"

modules-center = workspaces

;; =============================================================================
;; MÓDULOS
;; =============================================================================

;; ----- workspaces -----
;; internal/xworkspaces funciona con bspwm porque este expone los workspaces
;; vía _NET_DESKTOP_*. Cada label distingue un estado: active (con foco),
;; occupied (con ventanas), urgent (una app pide atención) y empty.
[module/workspaces]
type = internal/xworkspaces

;; Solo los workspaces de este monitor.
pin-workspaces = true
;; Cambiar de workspace con click o scroll sobre la barra.
enable-click = true
enable-scroll = true

;; Todos los workspaces usan el mismo punto como icono. Para uno propio por
;; workspace: `icon-N = <nombre>;<icono>`, donde <nombre> debe coincidir con
;; los de `bspc monitor -d` en bspwmrc (I, II, III...), no con su número.
icon-default = •

format = <label-state>

;; Jerarquía por color y tamaño, de más a menos importante: activo (punto
;; grande naranja) > urgente (rojo) > con ventanas (texto) > vacío (tenue).
;; El padding a ambos lados deja cada punto centrado en su zona de click.

;; Workspace con foco: punto grande en el color de foco del sistema.
label-active = ●
label-active-foreground = ${color.accent}
label-active-padding = 1

;; Con ventanas pero sin foco.
label-occupied = %icon%
label-occupied-foreground = ${color.text}
label-occupied-padding = 1

;; Una app pide atención.
label-urgent = %icon%
label-urgent-foreground = ${color.alert}
label-urgent-padding = 1

;; Vacíos: presentes para orientarse, pero casi fundidos con el fondo.
label-empty = %icon%
label-empty-foreground = ${color.subtle}
label-empty-padding = 1
