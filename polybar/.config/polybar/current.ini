;; ~/.config/polybar/current.ini
;; Barras flotantes de estado sobre el escritorio de bspwm (logo, red, VPN,
;; Firefox y anonimato, target y apagado). La barra de workspaces
;; vive aparte en workspace.ini.
;;
;; launch.sh lanza una instancia de polybar por barra usando este archivo:
;;   polybar log            -> logo de Parrot (esquina izquierda)
;;   polybar ethernet_bar   -> IP de la interfaz Ethernet
;;   polybar vpn_bar        -> estado de la VPN (HTB/THM)
;;   polybar launchers      -> Firefox personal y pentest, y anonimato
;;   polybar target_to_hack -> IP de la víctima tras `settarget` en zsh
;;   polybar primary        -> botón de apagado (esquina derecha)
;;
;; Recargar: Super+Alt+R (reinicia bspwm, que lanza launch.sh) o desde terminal:
;;   ~/.config/polybar/launch.sh
;;
;; Los iconos Nerd Font NO se escriben en este archivo: los glifos de uso
;; privado (PUA) los eliminan las herramientas de edición. Viven en los scripts
;; de ~/.config/scripts/ como escapes `$'\x..'`.

;; ----- AJUSTES GLOBALES DEL WM -----
;; Sin reserva de espacio: las barras flotan sobre el escritorio en posiciones
;; fijas y no ocupan un borde entero de la pantalla.
[global/wm]
margin-bottom = 0
margin-top = 0

;; ----- INCLUDES -----
;; colors.ini define la paleta usada por ${color.bg}, ${color.text}, etc.
;; Cambiar de tema = sobrescribir colors.ini con colors_dark.ini o colors_light.ini.
include-file = ~/.config/polybar/colors.ini

;; =============================================================================
;; PLANTILLA BASE
;; =============================================================================
;; bar/main no se lanza: todas las barras hacen `inherit = bar/main` y solo
;; declaran lo que las diferencia (ancho, posición X y módulo). Así el alto,
;; los colores y las fuentes se cambian en un único sitio.
[bar/main]
;; Todas las barras flotan arriba, con 40 px de alto (42 con el marco).
;; Espaciado: 12 px en todo (margen con los bordes de la pantalla y separación
;; entre barras), el mismo window_gap de bspwm: barras y ventanas quedan
;; alineadas en la misma rejilla.
bottom = false
height = 40
offset-y = 12
;; El módulo queda centrado aunque cambie el ancho de su contenido.
fixed-center = true

background = ${color.bg}
foreground = ${color.text}

;; Esquinas redondeadas (px) para el look de "card" flotante. 8 px, un escalón
;; por debajo de las ventanas (10): elementos más pequeños, radio más pequeño.
;; picom excluye las barras de su redondeo para que se respete este valor.
radius = 8
;; Marco de 1 px, igual que el borde de las ventanas en bspwm: barras y
;; ventanas se leen como piezas del mismo sistema.
border-size = 1
border-color = ${color.border}

padding = 1
module-margin = 0

;; Mantiene las barras por encima de las ventanas de bspwm; sin esto una
;; ventana en fullscreen las taparía.
wm-restack = bspwm

;; Fuentes, referenciables en los textos con %{TN}...%{T-}. Ojo: el índice de
;; %{T} empieza en 1, así que %{T1} = font-0 y %{T2} = font-1.
;; font-0: texto e iconos de los módulos. La misma familia que kitty, dunst y
;;         rofi, para que todo el escritorio hable con una sola tipografía.
;;         12 pt = 16 px a 96 DPI, el tamaño estándar de texto de interfaz.
;;         SemiBold (la familia no tiene Medium): el trazo Regular se pierde
;;         sobre el fondo oscuro de la barra.
;; font-1: logo de Parrot (U+F329). Hack lo dibuja más limpio que
;;         CaskaydiaCove a este tamaño.
font-0 = "CaskaydiaCove Nerd Font:style=SemiBold:size=12;3"
font-1 = "Hack Nerd Font Mono:size=20;6"

;; =============================================================================
;; BARRAS (de izquierda a derecha en pantalla)
;; =============================================================================
;; Anchos en píxeles, ajustados al contenido: con porcentajes, una barra con
;; dos iconos medía lo mismo que una con una IP. Cada offset-x = offset de la
;; barra anterior + su ancho + 12.
;; Las de la derecha se anclan al borde derecho con `100%:-N` (N = distancia
;; desde el borde derecho hasta el inicio de la barra), así la distribución
;; se mantiene aunque cambie la resolución.

;; ----- IZQUIERDA -----
;; Cuadrada: 42 x 42 con el marco.
[bar/log]
inherit = bar/main
width = 42
offset-x = 12
padding = 0
modules-center = parrot

;; 230 px: cabe una IP de 15 caracteres (xxx.xxx.xxx.xxx) con su icono.
[bar/ethernet_bar]
inherit = bar/main
width = 230
offset-x = 66
modules-center = ethernet_status

[bar/vpn_bar]
inherit = bar/main
width = 230
offset-x = 308
modules-center = vpn_status

;; ----- DERECHA -----
;; Herramientas de privacidad y pentest juntas: Firefox personal, Firefox
;; pentest y anonimato (fantasma: verde activado, gris desactivado; el color
;; lo pone el script).
;; N = 512 = 366 (target) + 12 + 134 (ancho propio).
;; module-margin = 1: un espacio a cada lado de cada icono, para separarlos.
;; 134 px = 2 de marco + padding (2 x 9,4) + 3 módulos x (margen + icono +
;; espacio + margen, 4 x 9,4): cabe exacto con CaskaydiaCove a 12 pt.
[bar/launchers]
inherit = bar/main
width = 134
offset-x = 100%:-512
module-margin = 1
modules-center = firefox_personal firefox_pentest anon_status

;; N = 366 = 54 (apagado) + 12 + 300 (ancho propio). 300 px: IP y nombre de
;; máquina.
[bar/target_to_hack]
inherit = bar/main
width = 300
offset-x = 100%:-366
modules-center = target_module

;; Botón de apagado, solo en el extremo derecho: aislado de los demás para que
;; no se pulse por error. Cuadrada como el logo: N = 54 = 12 de margen + 42.
[bar/primary]
inherit = bar/main
width = 42
offset-x = 100%:-54
padding = 0
modules-center = power

;; =============================================================================
;; MÓDULOS
;; =============================================================================
;; Todos son scripts de ~/.config/scripts/ (versionados en scripts/.config/scripts/).
;; `interval` = cada cuántos segundos polybar vuelve a ejecutar el script.
;; NUNCA usar `interval = 0`: polybar no lo interpreta como "una vez" sino como
;; relanzar el script en bucle sin pausa (llegó a consumir ~30% de CPU
;; constante y hacía laggear todo el escritorio). Para iconos estáticos se usa
;; 86400 (una vez al día).

;; ----- LOGO -----
;; Click: abre el gestor de archivos (igual que Super+E).
[module/parrot]
type = custom/script
exec = ~/.config/scripts/parrot_module.sh
interval = 86400
click-left = /usr/bin/nautilus --new-window &

;; ----- RED Y PENTEST -----
;; 1 segundo: son lecturas baratas (ip, un archivo de estado) y así el cambio
;; de VPN o de target se refleja al instante.
[module/ethernet_status]
type = custom/script
exec = ~/.config/scripts/ethernet_status.sh
interval = 1

[module/vpn_status]
type = custom/script
exec = ~/.config/scripts/vpn_status.sh
interval = 1

[module/target_module]
type = custom/script
exec = ~/.config/scripts/victim_to_hack.sh
interval = 1

;; ----- ANONIMATO -----
;; Muestra el estado que escribe toggle_anonymity.sh; el click lo alterna.
[module/anon_status]
type = custom/script
exec = ~/.config/scripts/anon_module.sh
interval = 1
click-left = ~/.config/scripts/toggle_anonymity.sh

;; Botón de apagado: abre el menú de sesión (apagar, reiniciar, cerrar sesión)
;; en vez de apagar directamente, para que un click equivocado no cierre todo.
[module/power]
type = custom/script
exec = ~/.config/scripts/power_module.sh
interval = 86400
click-left = ~/.config/scripts/powermenu.sh &

;; ----- FIREFOX -----
;; Cada click abre un perfil aislado. --no-remote permite tener ambos abiertos
;; a la vez; sin él Firefox abriría una pestaña en la instancia ya existente.
;; firefox_personal -> perfil default-esr (Gmail, GitHub personal, redes).
;; firefox_pentest  -> perfil pentest con user.js endurecido (sin fugas de
;;                     targets a terceros, sin precargas, WebRTC off, todo se
;;                     borra al cerrar). Ver system/firefox/pentest.user.js.
[module/firefox_personal]
type = custom/script
exec = ~/.config/scripts/firefox_personal_module.sh
interval = 86400
click-left = /usr/bin/firefox -P default-esr --no-remote &

;; TZ=UTC: respaldo por si se desactivara privacy.resistFingerprinting (que
;; Parrot activa y ya oculta la zona horaria). Mismo comando que en sxhkdrc.
[module/firefox_pentest]
type = custom/script
exec = ~/.config/scripts/firefox_pentest_module.sh
interval = 86400
click-left = TZ=UTC /usr/bin/firefox -P pentest --no-remote &
