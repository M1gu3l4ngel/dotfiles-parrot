# The Monokai Soda palette, the same as Windows Terminal and VS Code. kitty.conf includes it first,
# so a value set again there (cursor_shape) wins.

# kitty.conf's `cursor_shape beam` overrides this underline.
cursor_shape          Underline
cursor_underline_thickness 1
# 20 px of room around the text reads better.
window_padding_width  20

foreground #C4C5B5
background #1A1A1A

# ANSI colors: colorN is the normal one and colorN+8 the bright one.

# Black
color0 #1A1A1A
color8 #625E4C

# Red: Monokai's strong pink
color1 #F4005F
color9 #F4005F

# Green: bright lime
color2  #98E024
color10 #98E024

# Yellow: orange when normal, golden yellow when bright
color3  #FA8419
color11 #E0D561

# Blue: lilac
color4  #9D65FF
color12 #9D65FF

# Magenta: Monokai uses the same pink as red
color5  #F4005F
color13 #F4005F

# Cyan: light turquoise
color6  #58D1EB
color14 #58D1EB

# White: cream when normal, bone white when bright
color7  #C4C5B5
color15 #F6F6EF

cursor #F6F7EC
cursor_text_color #1A1A1A

selection_foreground #C4C5B5
selection_background #343434
