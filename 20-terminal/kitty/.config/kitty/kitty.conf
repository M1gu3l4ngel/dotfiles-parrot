# kitty, the default terminal (Super+Enter). The palette comes from color.ini.
# Reload without reopening kitty: Ctrl+Shift+F5.

# No bell, such as when a zsh completion is cancelled.
enable_audio_bell no

# kitty reads includes in order, so a value set again further down this file wins over the
# include's (cursor_shape below).
include color.ini

# CaskaydiaCove Nerd Font carries the icons the prompt (oh-my-posh), lsd and Neovim use; the same
# font as dunst and rofi, installed by bootstrap.sh. 12 pt, the size of PowerShell in Windows
# Terminal (dotfiles-windows), so the terminal reads the same on both machines.
font_family CaskaydiaCove Nerd Font
font_size 12
disable_ligatures never

# URLs in the output are detected and clickable.
url_color #61afef
url_style curly
detect_urls yes

# Ctrl+arrows move the focus between kitty's own splits, not bspwm's windows.
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# kitty switches tabs with Ctrl+Shift+Left/Right by default. A map with no action passes the key to
# the program, so zsh can use them to select words (.zshrc); Ctrl+Tab and Ctrl+Shift+Tab still
# switch tabs.
map kitty_mod+left
map kitty_mod+right

# Two internal clipboards that do not touch the system one: F1/F2 copy and paste buffer "a",
# F3/F4 buffer "b".
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

# A bar cursor, as in editors; it overrides color.ini's underline because it comes after the
# include.
cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0

# Milliseconds between repaints and input reads: lower is smoother output and more CPU. Redraws
# follow the monitor's refresh rate to avoid tearing.
repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
# Light red for inactive tabs, light green for the active one.
tab_bar_style powerline
inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foreground #000000
tab_bar_margin_color black

# New windows and tabs open in the current directory, with no `cd` each time.
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Opaque. A lower value lets the wallpaper through, with picom running.
background_opacity 1.0

# zsh even where the system SHELL is another one (bash in containers).
shell zsh
