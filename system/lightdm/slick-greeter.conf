# /etc/lightdm/slick-greeter.conf
# Pantalla de login de LightDM (slick-greeter), que también es la pantalla de
# bloqueo (Super+Shift+X -> dm-tool lock). La instala system/setup.sh como
# copia root:root, sustituyendo la de Parrot (paquete parrot-displaymanager);
# la original queda en /etc/lightdm/slick-greeter.conf.parrot.
# Se aplica en el siguiente login o bloqueo, sin reiniciar nada.

[Greeter]
# ----- FONDO -----
# El mismo fondo que el escritorio: bloquear y desbloquear se ve continuo.
# Copia del wallpaper del repo en una ruta que el usuario lightdm puede leer
# (no tiene acceso a los home).
background=/usr/share/backgrounds/dotfiles-wallpaper.jpg
# false: usar siempre el fondo de arriba, no el que AccountsService tenga
# guardado para cada usuario.
draw-user-background=false
# Sin la rejilla de puntos que slick-greeter dibuja sobre el fondo.
draw-grid=false

# ----- APARIENCIA -----
# Valores de Parrot, sin cambios: tema oscuro de GTK, iconos y logo.
logo=/usr/share/icons/parrot-logo.png
theme-name=ARK-Dark
icon-theme-name=Maia
